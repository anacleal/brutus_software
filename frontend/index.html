<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brutus — Ícones esportivos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="showcase">
      <header class="brand">
        <span class="brand__mark" aria-label="Logo da Atlética Brutus">B</span>
        <div>
          <p class="eyebrow">Atlética Brutus</p>
          <h1>Treine com a sua equipe.</h1>
        </div>
      </header>

      <section class="card" aria-labelledby="button-title">
        <div class="card__copy">
          <p class="eyebrow">Componente</p>
          <h2 id="button-title">Ação principal</h2>
          <p>O vermelho Brutus destaca ações de criação e inscrição em treinos.</p>
        </div>
        <button class="button button--primary" type="button">
          <span aria-hidden="true">+</span>
          Criar treino
        </button>
      </section>

      <section class="icon-gallery" aria-labelledby="icons-title">
        <div class="section-title">
          <p class="eyebrow">Ícones esportivos</p>
          <h2 id="icons-title">Biblioteca base</h2>
        </div>

        <div class="icon-grid">
          <button class="icon-button" type="button">
            <img src="./icons/actions/plus-svgrepo-com.svg" alt="Ícone de adicionar" />
            <span>Plus</span>
          </button>
          <button class="icon-button" type="button">
            <img src="./icons/actions/check-svgrepo-com.svg" alt="Ícone de confirmação" />
            <span>Check</span>
          </button>
          <button class="icon-button" type="button">
            <img src="./icons/actions/search-svgrepo-com.svg" alt="Ícone de busca" />
            <span>Search</span>
          </button>
          <button class="icon-button" type="button">
            <img src="./icons/actions/filter-svgrepo-com.svg" alt="Ícone de filtro" />
            <span>Filter</span>
          </button>
          <button class="icon-button" type="button">
            <img src="./icons/actions/bell-alt-1-svgrepo-com.svg" alt="Ícone de notificação" />
            <span>Bell</span>
          </button>
          <button class="icon-button" type="button">
            <img src="./icons/agenda-time/calendar-lines-svgrepo-com.svg" alt="Ícone de calendário" />
            <span>Calendar</span>
          </button>
          <button class="icon-button" type="button">
            <img src="./icons/agenda-time/clock-two-svgrepo-com.svg" alt="Ícone de relógio" />
            <span>Clock</span>
          </button>
          <button class="icon-button" type="button">
            <img src="./icons/navigation/map-pin-svgrepo-com.svg" alt="Ícone de localização" />
            <span>Location</span>
          </button>
          <button class="icon-button" type="button">
            <img src="./icons/navigation/home-svgrepo-com.svg" alt="Ícone inicial" />
            <span>Home</span>
          </button>
          <button class="icon-button" type="button">
            <img src="./icons/location-sport/trophy-svgrepo-com.svg" alt="Ícone de troféu" />
            <span>Trophy</span>
          </button>
          <button class="icon-button" type="button">
            <img src="./icons/location-sport/medal-ribbon-svgrepo-com.svg" alt="Ícone de medalha" />
            <span>Medal</span>
          </button>
          <button class="icon-button" type="button">
            <img src="./icons/location-sport/football-787-svgrepo-com.svg" alt="Ícone de futebol" />
            <span>Football</span>
          </button>
          <button class="icon-button" type="button">
            <img src="./icons/location-sport/dumbbell-svgrepo-com.svg" alt="Ícone de musculação" />
            <span>Dumbbell</span>
          </button>
          <button class="icon-button" type="button">
            <img src="./icons/profile-community/users-3-svgrepo-com.svg" alt="Ícone de equipe" />
            <span>Users</span>
          </button>
          <button class="icon-button" type="button">
            <img src="./icons/profile-community/user-svgrepo-com.svg" alt="Ícone de usuário" />
            <span>User</span>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
