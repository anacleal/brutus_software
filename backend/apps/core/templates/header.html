```html
<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brutus - Navegação</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #0A0D13;
        min-height: 100vh;
    }

    button {
        font: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
    }

    :root {
        --bg: #0A0D13;
        --border: rgba(255, 255, 255, 0.05);
        --accent: #C0392B;
        --accent-hover: #A52F23;
        --accent-active: #E05A4A;
        --avatar-bg: #1E2A3A;
        --text-25: rgba(255, 255, 255, 0.25);
        --text-35: rgba(255, 255, 255, 0.35);
        --text-40: rgba(255, 255, 255, 0.40);
        --text-50: rgba(255, 255, 255, 0.50);
        --text-55: rgba(255, 255, 255, 0.55);
        --text-60: rgba(255, 255, 255, 0.60);
        --text-80: rgba(255, 255, 255, 0.80);
        --white-5: rgba(255, 255, 255, 0.05);
        --white-8: rgba(255, 255, 255, 0.08);
    }

    .header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(10, 13, 19, 0.95);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid var(--border);
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .logo-badge {
        background: var(--accent);
        color: #fff;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        line-height: 1;
        user-select: none;
    }

    .logo-text {
        color: #fff;
        font-weight: 700;
        letter-spacing: -0.02em;
        transition: color .15s ease;
    }

    .logo:hover .logo-text {
        color: var(--text-80);
    }

    .icon-btn {
        position: relative;
        color: var(--text-35);
        padding: 8px;
        border-radius: 8px;
        transition: color .15s ease, background .15s ease;
    }

    .icon-btn:hover {
        color: #fff;
        background: var(--white-5);
    }

    .icon-dot {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 6px;
        height: 6px;
        background: var(--accent);
        border-radius: 50%;
    }

    .icon {
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .header-desktop {
        display: none;
        align-items: center;
        justify-content: space-between;
        height: 64px;
        padding: 0 32px;
    }

    .desktop-nav {
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .nav-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-50);
        border-radius: 8px;
        transition: color .15s ease, background .15s ease;
    }

    .nav-btn:hover {
        color: #fff;
        background: var(--white-5);
    }

    .nav-btn.active {
        color: #fff;
        background: var(--white-8);
    }

    .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .btn-primary {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        padding: 8px 16px;
        border-radius: 8px;
        transition: background .15s ease, box-shadow .15s ease;
    }

    .btn-primary:hover {
        background: var(--accent-hover);
    }

    .btn-primary.active {
        background: var(--accent-active);
        box-shadow: 0 0 0 2px rgba(224, 90, 74, 0.35);
    }

    .profile-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px;
        border-radius: 8px;
        transition: background .15s ease, box-shadow .15s ease;
    }

    .profile-btn:hover {
        background: var(--white-5);
    }

    .profile-btn.active {
        background: var(--white-8);
        box-shadow: 0 0 0 2px rgba(192, 57, 43, 0.35);
    }

    .profile-btn.active .profile-name {
        color: #fff;
    }

    .profile-btn.active .avatar {
        box-shadow: 0 0 0 2px rgba(224, 90, 74, 0.55);
    }

    .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--avatar-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        object-fit: cover;
        transition: box-shadow .15s ease;
    }

    .profile-btn:hover .avatar {
        box-shadow: 0 0 0 2px rgba(192, 57, 43, 0.4);
    }

    .profile-name {
        font-size: 14px;
        color: var(--text-55);
        font-weight: 500;
        padding-right: 4px;
        transition: color .15s ease;
    }

    .profile-btn:hover .profile-name {
        color: #fff;
    }

    .divider {
        width: 1px;
        height: 20px;
        background: var(--white-8);
        margin: 0 4px;
    }

    .logout-btn {
        color: var(--text-25);
        padding: 8px;
        border-radius: 8px;
        transition: color .15s ease, background .15s ease;
    }

    .logout-btn:hover {
        color: var(--text-60);
        background: var(--white-5);
    }

    .header-mobile {
        display: flex;
        flex-direction: column;
    }

    .mobile-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 48px;
        padding: 0 16px;
    }

    .mobile-topbar-actions {
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .mobile-tabs {
        display: flex;
        align-items: center;
        padding: 0 8px 6px;
    }

    .tab-btn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 6px 0;
        border-radius: 12px;
        color: var(--text-35);
        transition: color .15s ease, background .15s ease;
    }

    .tab-btn:hover {
        color: rgba(255, 255, 255, 0.65);
    }

    .tab-btn.highlight {
        color: var(--text-50);
    }

    .tab-btn.highlight:hover {
        color: rgba(255, 255, 255, 0.80);
    }

    .tab-btn.active {
        color: var(--accent-active);
        background: rgba(224, 90, 74, 0.08);
    }

    .tab-label {
        font-size: 10px;
        font-weight: 500;
        line-height: 1;
    }

    .page-content {
        max-width: 720px;
        margin: 0 auto;
        padding: 64px 24px;
        text-align: center;
    }

    .page-title {
        color: #fff;
        font-weight: 700;
        font-size: 24px;
        margin-bottom: 8px;
    }

    .page-desc {
        color: var(--text-40);
        font-size: 14px;
    }

    @media (min-width: 1024px) {

        .header-desktop {
            display: flex;
        }

        .header-mobile {
            display: none;
        }

    }

</style>

</head>

<body>

<header class="header header-desktop">

    <button class="logo" onclick="navigate('dashboard')">

        <div class="logo-badge" style="width:32px;height:32px;font-size:14px;">
            B
        </div>

        <span class="logo-text" style="font-size:18px;">
            Brutus
        </span>

    </button>

    <nav class="desktop-nav" id="desktop-main-nav"></nav>

    <div class="header-actions">

        <button
            class="btn-primary"
            id="desktop-create-workout"
            onclick="navigate('create-workout')"
        >
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            Criar treino
        </button>

        <button class="icon-btn">

            <svg class="icon" width="20" height="20" viewBox="0 0 24 24">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>

            <span class="icon-dot"></span>

        </button>

        <button
            class="profile-btn"
            id="desktop-profile"
            onclick="navigate('profile')"
        >

            <div class="avatar">

                <svg
                    class="icon"
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    style="color:var(--text-50);"
                >
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>

            </div>

            <span class="profile-name" id="desktop-username">
                Usuário
            </span>

        </button>

        <div class="divider"></div>

        <button class="logout-btn" title="Sair" onclick="logout()">

            <svg class="icon" width="16" height="16" viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
            </svg>

        </button>

    </div>

</header>

<header class="header header-mobile">

    <div class="mobile-topbar">

        <button class="logo" onclick="navigate('dashboard')">

            <div class="logo-badge" style="width:28px;height:28px;font-size:12px;">
                B
            </div>

            <span class="logo-text" style="font-size:16px;">
                Brutus
            </span>

        </button>

        <div class="mobile-topbar-actions">

            <button class="icon-btn">

                <svg class="icon" width="20" height="20" viewBox="0 0 24 24">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
                    <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                </svg>

                <span class="icon-dot"></span>

            </button>

            <button onclick="navigate('profile')" style="padding:4px;">

                <div class="avatar">

                    <svg
                        class="icon"
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        style="color:var(--text-50);"
                    >
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>

                </div>

            </button>

        </div>

    </div>

    <div class="mobile-tabs" id="mobile-nav"></div>

</header>

<main class="page-content">

    <h1 class="page-title" id="page-title">
        Início
    </h1>

    <p class="page-desc" id="page-desc">
        Esta é a página de destino — em construção.
    </p>

</main>


<script>

    const mainNav = [
        {
            page: "dashboard",
            label: "Início",
            icon: "home"
        },
        {
            page: "workouts",
            label: "Treinos",
            icon: "dumbbell"
        }
    ];

    const mobileNav = [
        {
            page: "dashboard",
            label: "Início",
            icon: "home",
            highlight: false
        },
        {
            page: "workouts",
            label: "Treinos",
            icon: "dumbbell",
            highlight: false
        },
        {
            page: "create-workout",
            label: "Criar",
            icon: "plus",
            highlight: true
        },
        {
            page: "profile",
            label: "Perfil",
            icon: "user",
            highlight: false
        }
    ];

    const icons = {

        home:
            '<path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

        dumbbell:
            '<path d="M6.5 6.5 17.5 17.5"/>' +
            '<path d="m4 8 2-2M18 20l2-2M2 12l2-2M20 16l2-2"/>' +
            '<rect x="2" y="14" width="4" height="4" rx="1"/>' +
            '<rect x="18" y="6" width="4" height="4" rx="1"/>' +
            '<rect x="4.5" y="4.5" width="4" height="4" rx="1" transform="rotate(45 6.5 6.5)"/>' +
            '<rect x="15.5" y="15.5" width="4" height="4" rx="1" transform="rotate(45 17.5 17.5)"/>',

        plus:
            '<line x1="12" y1="5" x2="12" y2="19"/>' +
            '<line x1="5" y1="12" x2="19" y2="12"/>',

        user:
            '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>' +
            '<circle cx="12" cy="7" r="4"/>'
    };

    const routes = {

        dashboard: "/dashboard/",
        workouts: "/treinos/",
        "create-workout": "/treinos/criar/",
        profile: "/perfil/"

    };

    function getCurrentPage() {

        const path = window.location.pathname;

        if (path === "/dashboard/") {
            return "dashboard";
        }

        if (path === "/treinos/") {
            return "workouts";
        }

        if (path === "/treinos/criar/") {
            return "create-workout";
        }

        if (path === "/perfil/") {
            return "profile";
        }

        return "dashboard";
    }


    let currentPage = getCurrentPage();


    function svgIcon(name, size) {

        const s = size || 18;

        return `
            <svg
                class="icon"
                width="${s}"
                height="${s}"
                viewBox="0 0 24 24"
            >
                ${icons[name]}
            </svg>
        `;
    }


    function renderDesktopNav() {

        const el = document.getElementById("desktop-main-nav");

        el.innerHTML = mainNav.map(item => `

            <button
                class="nav-btn ${currentPage === item.page ? "active" : ""}"
                onclick="navigate('${item.page}')"
            >
                ${svgIcon(item.icon, 16)}
                ${item.label}
            </button>

        `).join("");

        const createButton = document.getElementById("desktop-create-workout");

        if (currentPage === "create-workout") {
            createButton.classList.add("active");
        } else {
            createButton.classList.remove("active");
        }

        const profileButton = document.getElementById("desktop-profile");

        if (currentPage === "profile") {
            profileButton.classList.add("active");
        } else {
            profileButton.classList.remove("active");
        }
    }


    function renderMobileNav() {

        const el = document.getElementById("mobile-nav");

        el.innerHTML = mobileNav.map(item => {

            const classes = ["tab-btn"];

            if (item.highlight) {
                classes.push("highlight");
            }

            if (currentPage === item.page) {
                classes.push("active");
            }

            return `

                <button
                    class="${classes.join(" ")}"
                    onclick="navigate('${item.page}')"
                >

                    ${svgIcon(item.icon, 18)}

                    <span class="tab-label">
                        ${item.label}
                    </span>

                </button>

            `;

        }).join("");
    }


    function navigate(page) {

        const route = routes[page];

        if (route) {
            window.location.href = route;
        }

    }


    function logout() {

        alert("Sessão encerrada.");

    }


    renderDesktopNav();
    renderMobileNav();

</script>

</body>

</html>
